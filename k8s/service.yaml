apiVersion: v1
kind: Service
metadata:
  name: task-manager
  namespace: task-app
  labels:
    app: task-manager
spec:
  type: NodePort
  selector:
    app: task-manager
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
      # NodePort will be auto-assigned in the range 30000-32767
